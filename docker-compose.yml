services:
  app:
    build: .
    container_name: inventory-app
    restart: unless-stopped
    volumes:
      - ./:/app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.inventory-app.rule=Host(`inventory-app.localhost`)"
      - "traefik.http.services.inventory-app.loadbalancer.server.port=80"
