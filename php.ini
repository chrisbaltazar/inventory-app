; PHP runtime limits
memory_limit = 128M
max_execution_time = 120
max_input_time = 60
max_input_vars = 9999

; Upload limits
upload_max_filesize = 32M
post_max_size = 40M
max_file_uploads = 20

; Error handling
log_errors = Off
display_errors = On
error_reporting = E_ERROR & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE & ~E_WARNING

; Timezone
date.timezone = America/Mexico_City

; Sessions
session.gc_maxlifetime = 1440